# ---------------------------------------------------------------------------
# Fichier de configuration client --- décrit UNE plateforme Carbonio donnée.
# C'est ce fichier qui change d'un client à l'autre ; les templates ne
# bougent pas.
#
# Ce fichier d'exemple reprend la structure type observée sur les schémas
# de référence internes (3 zones Externe/DMZ/LAN, MTA IN/OUT/AUTH séparés,
# LDAP Master/Replica séparés, nœuds "Application" multi-rôles).
# ---------------------------------------------------------------------------

