    - name: "Paul Petit"
      role: "Intervenant technique"
      email: "paul.petit@exemple.fr"
      phone: ""

# Intégrateur (Zextras Services) --- valeurs par défaut fournies, à ajuster
# uniquement si un autre intégrateur intervient sur cette plateforme.
