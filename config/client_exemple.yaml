  date: "04/08/2026"
  classification: "Confidentiel"
  verificateur: "Laurent FRANÇOISE"
  logo: "logo_client_placeholder.png"   # chemin relatif à CE fichier de config
  description: "Exemple SA est une entreprise fictive utilisée comme cas d'exemple pour ce générateur de DAT."
  website: "https://www.exemple.fr"
  address:
    - "12 rue de l'Exemple"
    - "75000 Paris"
  emergency_phone: "+33 1 23 45 67 89"
  contacts:
